<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shalox Lion Movies Hub</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:white;font-family:Arial,sans-serif}
header{background:#1d1b2d;padding:22px 15px;text-align:center}
header h1{color:#f5bd35;margin:0}
header p{color:#ccc}
nav{padding:14px;text-align:center;background:#252337}
nav a{color:white;text-decoration:none;margin:12px}
main{padding:18px;max-width:1100px;margin:auto}
h2{color:#f5bd35}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:15px}
.card{background:#242337;border-radius:12px;overflow:hidden;padding-bottom:14px}
.card img{width:100%;height:190px;object-fit:cover;background:#333}
.card h3{font-size:16px;margin:10px}
.card p{font-size:13px;color:#ccc;margin:8px 10px}
.price{color:#f5bd35!important;font-weight:bold}
.notice{padding:15px;background:#242337;border-radius:10px;margin:15px 0;color:#ddd;overflow-wrap:anywhere}
video{width:100%;margin-top:8px;background:#000}
footer{text-align:center;padding:25px;color:#aaa}
</style>
</head>

<body>
<header>
<h1>🦁 SHALOX LION</h1>
<p>Movies Hub | Your Entertainment World</p>
</header>

<nav>
<a href="#movies">Movies</a>
<a href="#series">TV Series</a>
</nav>
<div style="text-align:center;padding:15px">
  <label for="language">Language / Lugha:</label>
  <select id="language" onchange="changeLanguage(this.value)">
    <option value="sw">Kiswahili</option>
    <option value="en">English</option>
  </select>
</div>
<main>
<div class="notice" id="status">Inaunganisha...</div>

<section id="movies">
<h2>🎬 Movies</h2>
<div class="grid" id="movieList"></div>
</section>

<section id="series">
<h2>📺 TV Series</h2>
<div class="grid" id="seriesList"></div>
</section>
</main>

<footer>
<p>Movie Reviews, Ratings & Trailers</p>
<p>© Shalox Lion Movies Hub</p>
</footer>

<script>
function changeLanguage(lang) {
  const savedLanguage = localStorage.getItem("siteLanguage") || "sw";

document.getElementById("language").value = savedLanguage;
changeLanguage(savedLanguage);
  const sw = lang === "sw";

  document.querySelector("header p").textContent =
    sw ? "Movies Hub | Ulimwengu wa Burudani" : "Movies Hub | Your Entertainment World";

  document.querySelectorAll("nav a")[0].textContent =
    sw ? "Filamu" : "Movies";

  document.querySelectorAll("nav a")[1].textContent =
    sw ? "Tamthilia" : "TV Series";

  document.querySelector("#movies h2").textContent =
    sw ? "🎬 Filamu" : "🎬 Movies";

  document.querySelector("#series h2").textContent =
    sw ? "📺 Tamthilia" : "📺 TV Series";
}
 const SUPABASE_URL =
"https://ddcnpqwlgwhfmtpfmnpm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_sPzS56wEqJEtag_21ls_4g_Uj8NwOGS";

async function loadContent(table){
 const response = await fetch(
  `${SUPABASE_URL}/rest/v1/${table}?select=*&is_published=eq.true&order=created_at.desc`,
  {
   headers:{
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY
   }
  }
 );

 if(!response.ok){
  throw new Error(
   table+": "+response.status+" "+await response.text()
  );
 }

 return await response.json();
}

function makeCard(item,isMovie){
 const card=document.createElement("div");
 card.className="card";

 const img=document.createElement("img");
 img.src=item.poster_url || "";
 img.alt=item.title || "Poster";
 card.appendChild(img);

 const title=document.createElement("h3");
 title.textContent=item.title || "Untitled";
 card.appendChild(title);

 if(item.description){
  const desc=document.createElement("p");
  desc.textContent=item.description;
  card.appendChild(desc);
 }

 if(isMovie){
  const price=document.createElement("p");
  price.className="price";
  price.textContent="TSh "+
   Number(item.price_tsh || 0).toLocaleString("en-US");
  card.appendChild(price);

  if(item.video_ref){
   const video=document.createElement("video");
   video.src=item.video_ref;
   video.controls=true;
   video.preload="metadata";
   video.playsInline=true;
   card.appendChild(video);
  }else{
   const msg=document.createElement("p");
   msg.textContent="Video haipatikani.";
   card.appendChild(msg);
  }
 }

 return card;
}

async function start(){
 const status=document.getElementById("status");
 const movieList=document.getElementById("movieList");
 const seriesList=document.getElementById("seriesList");

 try{
  status.textContent="Inaunganisha na Supabase...";

  const [movies,series]=await Promise.all([
   loadContent("movies"),
   loadContent("series")
  ]);

  movies.forEach(movie=>{
   movieList.appendChild(makeCard(movie,true));
  });

  series.forEach(item=>{
   seriesList.appendChild(makeCard(item,false));
  });

  status.textContent=
   "Imeunganishwa! Movies: "+movies.length+
   " | Series: "+series.length;

  if(!movies.length){
   movieList.textContent="Hakuna filamu zilizochapishwa.";
  }

  if(!series.length){
   seriesList.textContent="Hakuna series zilizochapishwa.";
  }

 }catch(error){
  status.textContent="Tatizo: "+error.message;
  console.error(error);
 }
}

start();
</script>
</body>
</html>
