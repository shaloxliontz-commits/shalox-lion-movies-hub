
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shalox Lion Movies Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101018;color:white;font-family:Arial,sans-serif}
header{background:#1d1b2d;padding:22px 15px;text-align:center}
header h1{color:#f5bd35;margin:0}
header p{color:#ccc}
nav{padding:14px;text-align:center;background:#252337}
nav a{color:white;text-decoration:none;margin:12px}
main{padding:18px;max-width:1100px;margin:auto}
h2{color:#f5bd35}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:15px}
.card{background:#242337;border-radius:12px;overflow:hidden;padding-bottom:14px}
.card img{width:100%;height:190px;object-fit:cover;background:#333}
.card h3{font-size:16px;margin:10px}
.card p{font-size:13px;color:#ccc;margin:8px 10px}
.price{color:#f5bd35;font-weight:bold}
.notice{padding:15px;background:#242337;border-radius:10px;margin:15px 0;color:#ddd}
button{background:#f5bd35;color:#171321;border:0;padding:10px 14px;border-radius:7px;font-weight:bold}
footer{text-align:center;padding:25px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>🦁 SHALOX LION</h1>
<p>Movies Hub | Your Entertainment World</p>
</header>
<nav>
<a href="#movies">Movies</a>
<a href="#series">TV Series</a>
</nav>
<main>
<div class="notice" id="status">Connecting to Movies Hub...</div>

<section id="movies">
<h2>🎬 Movies</h2>
<div class="grid" id="movieList"></div>
</section>

<section id="series">
<h2>📺 TV Series</h2>
<div class="grid" id="seriesList"></div>
</section>
</main>

<footer>
<p>Movie Reviews, Ratings & Trailers</p>
<p>© Shalox Lion Movies Hub</p>
</footer>

<script>
const SUPABASE_URL =
"https://ddcnpqwlgwhfmtpfmnpm.supabase.co";

const SUPABASE_KEY =
"sb_publishable_sPzS56wEqJEtag_21ls_4g_Uj8NwOGS";

async function loadContent(table){
 const response = await fetch(
  `${SUPABASE_URL}/rest/v1/${table}?select=*&is_published=eq.true&order=created_at.desc`,
  {
   headers:{
    "apikey":SUPABASE_KEY,
    "Authorization":"Bearer "+SUPABASE_KEY
   }
  }
 );
 if(!response.ok) {
 const errorText = await response.text();
 throw new Error("Supabase error " + response.status + ": " + errorText);
 }
 return await response.json();
}

function makeCard(item,isMovie){
 const card=document.createElement("div");
 card.className="card";

 const img=document.createElement("img");
 img.src=item.poster_url || "";
 img.alt=item.title || "Movie poster";
 card.appendChild(img);

 const title=document.createElement("h3");
 title.textContent=item.title;
 card.appendChild(title);

 if(item.description){
  const desc=document.createElement("p");
  desc.textContent=item.description;
  card.appendChild(desc);
 }

 if(isMovie){
  const price=document.createElement("p");
  price.className="price";
  price.textContent="TSh "+Number(item.price_tsh).toLocaleString("en-US");
  card.appendChild(price);

  if(item.video_url){
   const video=document.createElement("video");
   video.src=item.video_url;
   video.controls=true;
   video.preload="metadata";
   video.playsInline=true;
   video.style.width="100%";
   card.appendChild(video);
  }
 }

 return card;
}
 const card=document.createElement("div");
 card.className="card";

 const img=document.createElement("img");
 img.src=isMovie && item.poster_url ? item.poster_url : "";
 img.alt=item.title;
 card.appendChild(img);

 const title=document.createElement("h3");
 title.textContent=item.title;
 card.appendChild(title);

 if(item.description){
  const desc=document.createElement("p");
  desc.textContent=item.description;
  card.appendChild(desc);
 }

 if(isMovie){
  const price=document.createElement("p");
  price.className="price";
  price.textContent="TSh "+Number(item.price_tsh).toLocaleString("en-US");
  card.appendChild(price);
 }

 return card;
}

async function start(){
 try{
  const [movies,series]=await Promise.all([
   loadContent("movies"),
   loadContent("series")
  ]);

  const movieList=document.getElementById("movieList");
  const seriesList=document.getElementById("seriesList");

  movies.forEach(m=>movieList.appendChild(makeCard(m,true)));
  series.forEach(s=>seriesList.appendChild(makeCard(s,false)));

  document.getElementById("status").textContent=
   "Connected successfully! Movies: "+movies.length+
   " | Series: "+series.length;

  if(!movies.length) movieList.textContent="No published movies yet.";
  if(!series.length) seriesList.textContent="No published series yet.";

}catch(error){
 document.getElementById("status").textContent=
 "Supabase error: "+error.message;
 console.error("Supabase error:",error);
 }
}
start();
</script>
</body>
</html>
