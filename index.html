
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shalox Lion Movies Hub</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .container {
      max-width: 700px;
      margin: auto;
    }
    h1 {
      color: #f5c542;
    }
    .video {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 10px;
    }
    .price {
      font-size: 22px;
      color: #f5c542;
    }
    button {
      padding: 13px 25px;
      background: #f5c542;
      border: 0;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .note {
      color: #bbb;
      font-size: 14px;
    }
    #result {
      margin-top: 20px;
      color: #f5c542;
    }
  </style>
</head>
<body>
  <div class="container">

    <h1>🎬 SHALOX LION MOVIES HUB</h1>
    <p>Karibu kwenye Movie Hub yetu!</p>

    <iframe
      class="video"
      src="https://player.mediadelivery.net/embed/806238/662ce11f-1b51-462b-8937-fdd62988a2d5"
      allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>

    <h2>Movie Test</h2>
    <p class="price">Bei ya mfano: TSh 500</p>

    <button id="continueBtn" onclick="testPayment()">
      Endelea
    </button>

    <p id="result"></p>

    <p class="note">
      Huu ni ukurasa wa majaribio.
      Hakuna malipo yanayopokelewa.
      Video bado haijalindwa kwa mnunuzi.
    </p>

    <p>© 2026 Shalox Lion Movies Hub</p>

  </div>

  <script>
    async function testPayment() {
      const button = document.getElementById("continueBtn");
      const result = document.getElementById("result");

      button.disabled = true;
      result.textContent = "Inajaribu kuwasiliana na mfumo...";

      try {
        const response = await fetch(
          "/.netlify/functions/verify-payment",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              mode: "demo"
            })
          }
        );

        const data = await response.json();

        if (data.success && data.demo) {
          result.textContent = data.message;
        } else {
          result.textContent =
            data.message || "Jaribio halijafanikiwa.";
        }

      } catch (error) {
        result.textContent =
          "Imeshindikana kuwasiliana na mfumo. Jaribu tena.";
      }

      button.disabled = false;
    }
  </script>
</body>
</html>
