<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shalox Lion Admin</title>
<style>
body{background:#111;color:white;font-family:Arial;padding:20px}
input,textarea,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
button{background:#16a085;color:white;border:0;font-weight:bold}
#dashboard{display:none}
</style>
</head>
<body>

<h1>SHALOX LION ADMIN</h1>
<p>Movies & Series Dashboard</p>

<div id="login">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="status"></p>
</div>

<div id="dashboard">
<h2>Add Movie</h2>
<input id="title" placeholder="Movie name">
<textarea id="description" placeholder="Description"></textarea>
<input id="posterFile" type="file" accept="image/*">
<input id="price" type="number" placeholder="Price TZS" value="300">
<input id="videoFile" type="file" accept="video/*">
<button onclick="addMovie()">Save Movie</button>

<hr>

<h2>Add Series</h2>
<input id="seriesTitle" placeholder="Series name">
<textarea id="seriesDescription" placeholder="Description"></textarea>
<button onclick="addSeries()">Save Series</button>

<button onclick="logout()">Logout</button>
<p id="result"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ddcnpqwlgwhfmtpfmnpm.supabase.co";
const KEY = "sb_publishable_sPzS56wEqJEtag_21ls_4g_Uj8NwOGS";
const db = supabase.createClient(SUPABASE_URL, KEY);

async function login(){
 const status = document.getElementById("status");
 status.textContent = "Logging in...";

 try {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const {error} = await db.auth.signInWithPassword({email,password});

  if(error){
   status.textContent = error.message;
   return;
  }

  document.getElementById("login").style.display="none";
  document.getElementById("dashboard").style.display="block";
 } catch(error) {
  status.textContent = error.message;
 }
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function addMovie(){
 const result = document.getElementById("result");

 try {
  const title = document.getElementById("title").value.trim();
  const posterFile = document.getElementById("posterFile").files[0];
  const videoFile = document.getElementById("videoFile").files[0];

  if(!title || !posterFile || !videoFile){
   result.textContent = "Enter movie name and choose poster and video.";
   return;
  }

  result.textContent = "Uploading files...";

  const posterPath = "posters/" + Date.now() + "-" + posterFile.name;
  const videoPath = "videos/" + Date.now() + "-" + videoFile.name;

  const {error: posterError} = await db.storage
   .from("movie-files").upload(posterPath, posterFile);

  if(posterError){
   result.textContent = posterError.message;
   return;
  }

  const {error: videoError} = await db.storage
   .from("movie-files").upload(videoPath, videoFile);

  if(videoError){
   result.textContent = videoError.message;
   return;
  }

  const posterUrl = db.storage.from("movie-files")
   .getPublicUrl(posterPath).data.publicUrl;

  const videoUrl = db.storage.from("movie-files")
   .getPublicUrl(videoPath).data.publicUrl;

  const {error} = await db.from("movies").insert({
   title: title,
   description: document.getElementById("description").value,
   poster_url: posterUrl,
   price_tsh: Number(document.getElementById("price").value),
   video_ref: videoUrl,
   is_published: false
  });

  result.textContent = error ? error.message : "Movie uploaded successfully!";

 } catch(error) {
  result.textContent = error.message;
 }
}

async function addSeries(){
 const result = document.getElementById("result");

 try {
  const title = document.getElementById("seriesTitle").value.trim();

  if(!title){
   result.textContent = "Enter series name first.";
   return;
  }

  const {error} = await db.from("series").insert({
   title: title,
   description: document.getElementById("seriesDescription").value,
   is_published: false
  });

  result.textContent = error ? error.message : "Series saved successfully!";

 } catch(error) {
  result.textContent = error.message;
 }
}
</script>
</body>
</html>
