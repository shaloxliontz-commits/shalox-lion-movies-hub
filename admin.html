<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shalox Lion Admin</title>
<style>
body{background:#111;color:white;font-family:Arial;padding:20px}
input,textarea,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
button{background:#16a085;color:white;border:0;font-weight:bold}
#dashboard{display:none}
</style>
</head>
<body>

<h1>SHALOX LION ADMIN</h1>
<p>Movies & Series Dashboard</p>

<div id="login">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<p id="status"></p>
</div>

<div id="dashboard">
<h2>Add Movie</h2>
<input id="title" placeholder="Movie name">
<textarea id="description" placeholder="Description"></textarea>
<input id="poster" placeholder="Poster URL">
<input id="price" type="number" placeholder="Price TZS" value="300">
<input id="video" placeholder="Video ID">
<button onclick="addMovie()">Save Movie</button>

<hr>

<h2>Add Series</h2>
<input id="seriesTitle" placeholder="Series name">
<textarea id="seriesDescription" placeholder="Description"></textarea>
<button onclick="addSeries()">Save Series</button>

<button onclick="logout()">Logout</button>
<p id="result"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const URL = "https://ddcnpqwlgwhfmtpfmnpm.supabase.co";
const KEY = "sb_publishable_sPzS56wEqJEtag_21ls_4g_Uj8NwOGS";
const db = supabase.createClient(URL, KEY);

async function login(){
 const email = document.getElementById("email").value;
 const password = document.getElementById("password").value;
 const status = document.getElementById("status");

 const {data,error} = await db.auth.signInWithPassword({email,password});

 if(error){
   status.textContent = error.message;
   return;
 }

 document.getElementById("login").style.display="none";
 document.getElementById("dashboard").style.display="block";
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function addMovie(){
 const {error} = await db.from("movies").insert({
  title: document.getElementById("title").value,
  description: document.getElementById("description").value,
  poster_url: document.getElementById("poster").value,
  price_tsh: Number(document.getElementById("price").value),
  video_ref: document.getElementById("video").value,
  is_published: false
 });

 document.getElementById("result").textContent =
 error ? error.message : "Movie saved successfully!";
}

async function addSeries(){
 const {error} = await db.from("series").insert({
  title: document.getElementById("seriesTitle").value,
  description: document.getElementById("seriesDescription").value,
  is_published: false
 });

 document.getElementById("result").textContent =
 error ? error.message : "Series saved successfully!";
}
</script>
</body>
</html>p
