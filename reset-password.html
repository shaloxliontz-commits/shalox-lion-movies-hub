<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:#111;color:white;font-family:Arial;padding:25px">
<h2>SHALOX LION</h2>
<h3>Reset Password</h3>

<input id="newpass" type="password" placeholder="New password">
<br><br>
<button onclick="changePass()">Save Password</button>
<p id="msg"></p>

<script>
const db = supabase.createClient(
  "https://ddcnpqwlgwhfmtpfmnpm.supabase.co",
  "sb_publishable_sPzS56wEqJEtag_21ls_4g_Uj8NwOGS"
);

async function changePass(){
  const password = document.getElementById("newpass").value;
  const msg = document.getElementById("msg");

  if(password.length < 8){
    msg.textContent = "Password iwe na herufi/namba 8 au zaidi";
    return;
  }

  const {error} = await db.auth.updateUser({password});

  if(error){
    msg.textContent = error.message;
  } else {
    msg.textContent = "Password changed successfully!";
  }
}
</script>
</body>
</html>
